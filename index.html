<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recanto dos Hábitos</title>
  <meta name="description" content="Um mini RPG cozy em pixel art para cuidar dos seus hábitos: ganhe XP, suba de nível e troque pontos por recompensas.">
  <meta name="theme-color" content="#f6e9c9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='7' y='7' width='2' height='5' fill='%234f8a4b'/%3E%3Crect x='3' y='4' width='4' height='3' fill='%2386c06c'/%3E%3Crect x='9' y='3' width='4' height='3' fill='%2386c06c'/%3E%3Crect x='4' y='12' width='8' height='3' fill='%23e68a6a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hero" aria-label="Seu personagem"></header>
    <main id="main"></main>
  </div>

  <button id="fab" class="btn fab" aria-label="Adicionar" data-act="fab">+</button>

  <nav id="tabbar" aria-label="Navegação principal">
    <div class="tabs">
      <button class="tab" data-act="tab" data-v="habits"><span class="ti">🌱</span><span>Hábitos</span></button>
      <button class="tab" data-act="tab" data-v="quests"><span class="ti">📜</span><span>Quests</span></button>
      <button class="tab" data-act="tab" data-v="shop"><span class="ti">🧺</span><span>Loja</span></button>
      <button class="tab" data-act="tab" data-v="profile"><span class="ti">🏡</span><span>Perfil</span></button>
    </div>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <div id="fx" aria-hidden="true"></div>

  <noscript><p style="padding:24px">O Recanto dos Hábitos precisa de JavaScript para funcionar.</p></noscript>
  <script src="firebase-config.js"></script>
  <script src="merge.js"></script>
  <script src="sync-core.js"></script>
  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
